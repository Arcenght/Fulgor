<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hábitos</title>
<style>
:root{--bg:#f5f6f8;--ink:#1b1e24;--mut:#656b76;--line:#d9dce2;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#14161a;--ink:#e6e8ec;--mut:#98a0ac;--line:#2a2e35}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;font-variant-numeric:tabular-nums}
main{max-width:920px;margin:0 auto;padding:24px 16px 64px}
header{display:flex;gap:8px;align-items:center;margin-bottom:24px}
h1{font-size:24px;margin:0 auto 0 0;font-weight:700;letter-spacing:-.02em}
select,input,button{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 10px}
button{cursor:pointer}
button.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
form{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin-bottom:32px}
label{display:flex;flex-direction:column;gap:2px;font-size:13px;color:var(--mut)}
#err{background:color-mix(in srgb,#d33 14%,var(--bg));border:1px solid #d33;border-radius:6px;padding:8px 12px;margin:0 0 20px}
.area{margin-bottom:36px}
.area h2{font-size:17px;margin:0;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.area h2 span{color:var(--mut);font-weight:400;font-size:13px}
.sw{width:10px;height:10px;border-radius:50%;background:var(--c);align-self:center}
.scroll{overflow-x:auto;padding:6px 0 8px}
.months{position:relative;height:16px;font-size:12px;color:var(--mut)}
.months span{position:absolute;top:0}
.grid{display:grid;grid-template-rows:repeat(7,12px);grid-auto-flow:column;grid-auto-columns:12px;gap:3px;width:max-content}
.d{width:12px;height:12px;padding:0;border:0;border-radius:3px;background:color-mix(in srgb,var(--ink) 9%,var(--bg))}
.d[data-level="1"]{background:color-mix(in srgb,var(--c) 30%,var(--bg))}
.d[data-level="2"]{background:color-mix(in srgb,var(--c) 52%,var(--bg))}
.d[data-level="3"]{background:color-mix(in srgb,var(--c) 76%,var(--bg))}
.d[data-level="4"]{background:var(--c)}
.d.sel{outline:2px solid var(--ink);outline-offset:1px}
.det{margin-top:8px;font-size:14px}
.det .ev{display:flex;gap:10px;align-items:center;padding:2px 0}
.det button{font-size:12px;padding:2px 8px}
.mut{color:var(--mut)}
#tip{position:fixed;display:none;pointer-events:none;z-index:9;background:var(--ink);color:var(--bg);padding:4px 8px;border-radius:5px;font-size:12px;white-space:nowrap;transform:translate(-50%,-100%)}
#info{background:color-mix(in srgb,#2f81f7 14%,var(--bg));border:1px solid #2f81f7;border-radius:6px;padding:8px 12px;margin:0 0 20px;word-break:break-all}
#ger{border:1px solid var(--line);border-radius:8px;padding:4px 16px 12px;margin-bottom:28px}
#ger h3{font-size:14px;margin:14px 0 4px}
.row{display:flex;gap:8px;align-items:center;margin:4px 0;flex-wrap:wrap}
.grow{flex:1}
#fa{margin:12px 0;padding:12px;border:1px dashed var(--line);border-radius:6px}
#g-hist{font-size:13px;color:var(--mut);padding-left:18px;max-height:240px;overflow:auto}
</style>
</head>
<body>
<main>
  <header>
    <h1>Hábitos</h1>
    <select id="ano" aria-label="Período"></select>
    <select id="disp" aria-label="Dispositivo que está registrando"></select>
    <button id="ger-btn" type="button">Gerenciar</button>
  </header>

  <section id="ger" hidden>
    <h3>Dispositivos</h3><div id="g-disp"></div>
    <h3>Áreas</h3><div id="g-area"></div>
    <form id="fa" hidden>
      <label>Nome <input id="fa-nome" required></label>
      <label>Tipo <select id="fa-tipo"><option value="booleano">Feito / não feito</option><option value="quantidade">Quantidade (nível pela soma do dia)</option></select></label>
      <label>Unidade <input id="fa-un" placeholder="opcional" style="width:8em"></label>
      <label id="fa-lim" hidden>Mínimo dos níveis 1 a 4 (crescente)
        <span class="row"><input class="lim" type="number" min="0" step="any" style="width:5em"><input class="lim" type="number" min="0" step="any" style="width:5em"><input class="lim" type="number" min="0" step="any" style="width:5em"><input class="lim" type="number" min="0" step="any" style="width:5em"></span></label>
      <label>Cor <input id="fa-cor" type="color"></label>
      <button class="primary" type="submit">Salvar área</button>
      <button id="fa-x" type="button">Cancelar</button>
    </form>
    <h3>Histórico de alterações</h3><ol id="g-hist"></ol>
  </section>

  <form id="f">
    <label>Área <select id="area"></select></label>
    <label>Data <input id="data" type="date" required></label>
    <label id="lv" hidden>Valor <input id="valor" type="number" min="0" step="any" style="width:7em"></label>
    <label>Nota <input id="nota" type="text" placeholder="opcional"></label>
    <button class="primary" type="submit">Registrar</button>
  </form>

  <p id="err" role="alert" hidden></p>
  <p id="info" hidden></p>
  <div id="areas"></div>
</main>
<div id="tip"></div>

<script>
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2, '0');
const fmtN = n => Number(n).toLocaleString('pt-BR', { maximumFractionDigits: 2 });
const fmtD = iso => new Date(iso + 'T12:00:00').toLocaleDateString('pt-BR', { day: 'numeric', month: 'long', year: 'numeric' });
const MESES = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
const DISP_KEY = 'habitos_dispositivo';

function el(tag, props = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === 'class') e.className = v;
    else if (k === 'text') e.textContent = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v);
  }
  e.append(...kids);
  return e;
}

async function api(path, opts = {}) {
  const headers = { ...(opts.headers || {}) };
  const d = localStorage.getItem(DISP_KEY);
  if (d) headers['X-Dispositivo'] = d;
  const r = await fetch(path, { ...opts, headers });
  if (!r.ok) {
    let m = r.statusText;
    try { const j = await r.json(); m = typeof j.detail === 'string' ? j.detail : 'Dados inválidos.'; } catch {}
    const e = new Error(m); e.status = r.status; throw e;
  }
  return r.status === 204 ? null : r.json();
}

const erro = m => { const e = $('#err'); e.textContent = m || ''; e.hidden = !m; };
function falha(e) {
  erro(e.status === 401 ? 'Escolha um dispositivo no seletor do topo para registrar.' : e.message);
}

let ano = null;       // null = últimos 12 meses (termina hoje)
let hoje = '';        // dia atual no fuso do servidor
let janela = { inicio: '', fim: '' };
let cals = [];
let sel = null;       // { area, data }

function rotulo(a, d) {
  if (!d.contagem) return `${fmtD(d.data)}: sem registro`;
  return `${fmtD(d.data)}: ${a.unidade ? fmtN(d.total) + ' ' + a.unidade : 'feito'}`;
}

function opcoesAno() {
  const s = $('#ano'), y0 = Number(hoje.slice(0, 4));
  s.replaceChildren(el('option', { value: '', text: 'Últimos 12 meses' }));
  for (let y = y0; y >= y0 - 4; y--) s.append(el('option', { value: y, text: y }));
  if (ano && ano < y0 - 4) s.append(el('option', { value: ano, text: ano }));
  s.value = ano || '';
}

function opcoesArea() {
  const s = $('#area'), atual = s.value;
  s.replaceChildren(...cals.map(c => el('option', { value: c.area.id, text: c.area.nome })));
  if (atual) s.value = atual;
  atualizarForm();
}

function areaSelecionada() {
  const c = cals.find(c => String(c.area.id) === $('#area').value);
  return c ? c.area : null;
}

function atualizarForm() {
  const a = areaSelecionada();
  const usaValor = !!a && (a.tipo === 'quantidade' || !!a.unidade);
  $('#lv').hidden = !usaValor;
  $('#valor').required = usaValor;
  $('#lv').firstChild.textContent = a && a.unidade ? `Valor (${a.unidade}) ` : 'Valor ';
}

async function detalhe(a, data, box) {
  box.replaceChildren(el('strong', { text: fmtD(data) }));
  try {
    const ev = await api(`/api/eventos?area_id=${a.id}&de=${data}&ate=${data}`);
    if (!ev.length) { box.append(el('div', { class: 'mut', text: 'Nenhum registro neste dia.' })); return; }
    for (const e of ev) {
      const txt = (a.unidade ? `${fmtN(e.valor)} ${a.unidade}` : 'feito')
        + (e.nota ? `: ${e.nota}` : '')
        + (e.origem ? ` · ${e.origem}` : '');
      box.append(el('div', { class: 'ev' },
        el('span', { text: txt }),
        el('button', { type: 'button', text: 'Remover', onclick: () => remover(e.id) })));
    }
  } catch (x) { falha(x); }
}

function secao(c) {
  const a = c.area, dias = c.dias;
  const off = new Date(janela.inicio + 'T12:00:00').getDay();   // 0 = domingo
  const cols = Math.ceil((off + dias.length) / 7);
  const ativos = dias.filter(d => d.contagem).length;
  const total = dias.reduce((s, d) => s + d.total, 0);
  const resumo = `${ativos} ${ativos === 1 ? 'dia' : 'dias'}` + (a.unidade ? `, ${fmtN(total)} ${a.unidade}` : '');

  const meses = el('div', { class: 'months', style: `width:${cols * 15}px` });
  dias.forEach((d, i) => {
    if (d.data.slice(8) === '01') {
      meses.append(el('span', { text: MESES[Number(d.data.slice(5, 7)) - 1], style: `left:${Math.floor((off + i) / 7) * 15}px` }));
    }
  });

  const grid = el('div', { class: 'grid' });
  dias.forEach((d, i) => {
    const b = el('button', { type: 'button', class: 'd', 'data-level': d.nivel, 'data-i': i, 'aria-label': rotulo(a, d) });
    if (i === 0) b.style.gridRowStart = off + 1;
    if (sel && sel.area === a.id && sel.data === d.data) b.classList.add('sel');
    grid.append(b);
  });

  const det = el('div', { class: 'det' });
  const diaDe = t => { const b = t.closest('.d'); return b ? { b, d: dias[b.dataset.i] } : null; };
  const mostrar = t => {
    const x = diaDe(t); if (!x) return;
    const r = x.b.getBoundingClientRect(), tip = $('#tip');
    tip.textContent = rotulo(a, x.d);
    tip.style.left = `${r.left + r.width / 2}px`;
    tip.style.top = `${r.top - 6}px`;
    tip.style.display = 'block';
  };
  const esconder = () => { $('#tip').style.display = 'none'; };
  grid.addEventListener('mouseover', e => mostrar(e.target));
  grid.addEventListener('focusin', e => mostrar(e.target));
  grid.addEventListener('mouseout', esconder);
  grid.addEventListener('focusout', esconder);
  grid.addEventListener('click', e => {
    const x = diaDe(e.target); if (!x) return;
    sel = { area: a.id, data: x.d.data };
    document.querySelectorAll('.d.sel').forEach(n => n.classList.remove('sel'));
    document.querySelectorAll('.det').forEach(n => n.replaceChildren());
    x.b.classList.add('sel');
    $('#area').value = a.id; atualizarForm();
    $('#data').value = x.d.data;
    detalhe(a, x.d.data, det);
  });
  if (sel && sel.area === a.id) detalhe(a, sel.data, det);

  return el('section', { class: 'area', style: `--c:${a.cor}` },
    el('h2', {}, el('i', { class: 'sw' }), a.nome, el('span', { text: resumo })),
    el('div', { class: 'scroll' }, meses, grid),
    det);
}

function render() {
  const box = $('#areas');
  if (!cals.length) { box.replaceChildren(el('p', { class: 'mut', text: 'Nenhuma área cadastrada.' })); return; }
  box.replaceChildren(...cals.map(secao));
  document.querySelectorAll('.scroll').forEach(s => { s.scrollLeft = s.scrollWidth; });  // mostra o dia atual
}

async function load() {
  try {
    const r = await api('/api/calendarios' + (ano ? `?ano=${ano}` : ''));
    cals = r.areas; hoje = r.hoje; janela = { inicio: r.inicio, fim: r.fim };
    erro('');
    const d = $('#data');
    d.max = hoje;
    if (!d.value || d.value > hoje) d.value = hoje;
    opcoesAno(); opcoesArea(); render();
  } catch (e) { falha(e); }
}

async function remover(id) {
  if (!confirm('Remover este registro?')) return;
  try { await api(`/api/eventos/${id}`, { method: 'DELETE' }); await load(); }
  catch (e) { falha(e); }
}

// Vira o dia (no fuso do servidor): recarrega para o calendário avançar até o novo "hoje".
async function checarDia() {
  try { const r = await api('/api/hoje'); if (hoje && r.hoje !== hoje) load(); } catch {}
}
setInterval(checarDia, 60000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) checarDia(); });

$('#ano').addEventListener('change', e => { ano = e.target.value ? Number(e.target.value) : null; sel = null; load(); });
$('#area').addEventListener('change', atualizarForm);
let disps = [], editando = 0;
const enviar = (m, p, b) => api(p, { method: m, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(b) });
const info = m => { const e = $('#info'); e.textContent = m || ''; e.hidden = !m; };

async function carregarDisps() {
  disps = await api('/api/dispositivos');
  let id = localStorage.getItem(DISP_KEY);
  if (!disps.some(d => String(d.id) === id)) {
    id = disps[0] ? String(disps[0].id) : '';
    if (id) localStorage.setItem(DISP_KEY, id); else localStorage.removeItem(DISP_KEY);
  }
  $('#disp').replaceChildren(...disps.map(d => el('option', { value: d.id, text: d.nome })));
  $('#disp').value = id;
}

async function acao(fn) {
  try { await fn(); erro(''); await carregarDisps(); await load(); if (!$('#ger').hidden) await renderGer(); }
  catch (e) { falha(e); }
}

function renderDisps() {
  const n = el('input', { placeholder: 'novo dispositivo', 'aria-label': 'Nome do novo dispositivo' });
  $('#g-disp').replaceChildren(...disps.map(d => {
    const i = el('input', { value: d.nome, 'aria-label': 'Nome do dispositivo' });
    return el('div', { class: 'row' }, i,
      el('button', { type: 'button', text: 'Renomear', onclick: () => acao(() => enviar('PUT', `/api/dispositivos/${d.id}`, { nome: i.value.trim() })) }),
      el('button', { type: 'button', text: 'Remover', onclick: () => { if (confirm(`Remover "${d.nome}"? O token dele deixa de funcionar.`)) acao(() => api(`/api/dispositivos/${d.id}`, { method: 'DELETE' })); } }));
  }), el('div', { class: 'row' }, n,
    el('button', { type: 'button', class: 'primary', text: 'Adicionar', onclick: () => acao(async () => {
      const r = await enviar('POST', '/api/dispositivos', { nome: n.value.trim() });
      info(`Token de "${r.nome}" para uso em API/ESP32 (aparece só agora): ${r.token}`);
    }) })));
}

function renderAreas() {
  $('#g-area').replaceChildren(...cals.map(({ area: a }) => el('div', { class: 'row' },
    el('span', { class: 'grow', text: `${a.nome} (${a.tipo}${a.unidade ? ', ' + a.unidade : ''}${a.limites ? ', níveis ' + a.limites.join('/') : ''})` }),
    el('button', { type: 'button', text: 'Editar', onclick: () => abrirArea(a) }),
    el('button', { type: 'button', text: 'Remover', onclick: () => { if (confirm(`Remover "${a.nome}" e todos os registros dela? Tudo fica guardado no histórico.`)) acao(() => api(`/api/areas/${a.id}`, { method: 'DELETE' })); } }))),
    el('button', { type: 'button', text: 'Nova área', onclick: () => abrirArea(null) }));
}

function resumoH(x) {
  const a = (x.antes && x.antes.area) || x.antes, b = x.depois;
  if (x.acao === 'editar') {
    const mud = Object.keys(b).filter(k => JSON.stringify(a[k]) !== JSON.stringify(b[k]));
    return mud.map(k => `${k}: ${a[k] ?? '—'} → ${b[k] ?? '—'}`).join('; ') || 'sem mudanças';
  }
  return (b || a).nome + (x.acao === 'remover' && x.antes.eventos ? ` (${x.antes.eventos.length} registros arquivados)` : '');
}

async function renderGer() {
  renderDisps(); renderAreas();
  try {
    const h = await api('/api/historico?limite=50');
    $('#g-hist').replaceChildren(...h.map(x => el('li', { text: `${new Date(x.em).toLocaleString('pt-BR')} · ${x.origem || '?'} · ${x.acao} ${x.entidade}: ${resumoH(x)}` })));
  } catch (e) { falha(e); }
}

const limVis = () => { $('#fa-lim').hidden = $('#fa-tipo').value !== 'quantidade'; };
function abrirArea(a) {
  editando = a ? a.id : 0;
  $('#fa').hidden = false;
  $('#fa-nome').value = a ? a.nome : '';
  $('#fa-tipo').value = a ? a.tipo : 'booleano';
  $('#fa-un').value = (a && a.unidade) || '';
  $('#fa-cor').value = a ? a.cor : '#216e39';
  document.querySelectorAll('.lim').forEach((i, k) => { i.value = a && a.limites ? a.limites[k] : ''; });
  limVis();
  $('#fa-nome').focus();
}

$('#disp').addEventListener('change', e => localStorage.setItem(DISP_KEY, e.target.value));
$('#ger-btn').addEventListener('click', () => { const g = $('#ger'); g.hidden = !g.hidden; if (!g.hidden) renderGer(); });
$('#fa-tipo').addEventListener('change', limVis);
$('#fa-x').addEventListener('click', () => { $('#fa').hidden = true; });
$('#fa').addEventListener('submit', ev => {
  ev.preventDefault();
  const tipo = $('#fa-tipo').value;
  const body = { nome: $('#fa-nome').value.trim(), tipo, unidade: $('#fa-un').value.trim() || null, cor: $('#fa-cor').value };
  if (tipo === 'quantidade') body.limites = [...document.querySelectorAll('.lim')].map(i => parseFloat(i.value));
  const id = editando;
  $('#fa').hidden = true;
  acao(() => id ? enviar('PUT', `/api/areas/${id}`, body) : enviar('POST', '/api/areas', body));
});
$('#f').addEventListener('submit', async ev => {
  ev.preventDefault();
  const a = areaSelecionada(); if (!a) return;
  const body = { area_id: a.id, data: $('#data').value };
  if (!$('#lv').hidden) {
    const v = parseFloat($('#valor').value);
    if (!(v > 0)) { erro('Informe um valor maior que zero.'); return; }
    body.valor = v;
  }
  const nota = $('#nota').value.trim();
  if (nota) body.nota = nota;
  try {
    await api('/api/eventos', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    $('#valor').value = ''; $('#nota').value = '';
    if (body.data < janela.inicio || body.data > janela.fim) ano = Number(body.data.slice(0, 4));  // data fora do período exibido
    sel = { area: a.id, data: body.data };
    await load();
  } catch (e) { falha(e); }
});

(async () => { try { await carregarDisps(); } catch (e) { falha(e); } load(); })();
</script>
</body>
</html>
